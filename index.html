<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NOVA AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #030302; color: #f7ead8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .app { position: relative; width: 100%; height: 100dvh; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at 50% 40%, rgba(255, 107, 24, 0.12), transparent 40%), linear-gradient(180deg, #080604 0%, #030302 100%); }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) 20px 12px; border-bottom: 1px solid rgba(255, 156, 81, 0.1); z-index: 10; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.2em; color: #ffe3bb; }
    .brand-mark { width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffcb7c, #ff8d29, #140500); display: grid; place-items: center; color: #2c1608; font-size: 12px; }
    .core-stage { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #coreCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .core-btn { position: relative; width: 180px; height: 180px; border-radius: 50%; background: transparent; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; }
    .core-title { font-size: 24px; font-weight: 300; letter-spacing: 0.4em; color: #fff2d5; text-shadow: 0 0 20px rgba(255, 182, 89, 0.8); margin-left: 0.4em; }
    .core-status { font-size: 9px; letter-spacing: 0.2em; color: rgba(255, 206, 151, 0.7); margin-top: 6px; text-transform: uppercase; }
    .core-instruction { font-size: 11px; letter-spacing: 0.1em; color: rgba(255, 255, 255, 0.5); margin-top: 4px; }
    .chat-overlay { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); width: min(90%, 500px); max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px; z-index: 5; }
    .controls-bar { padding: 12px 20px max(16px, env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
    .action-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 170, 92, 0.2); color: #ffe3bb; padding: 12px 20px; border-radius: 30px; font-size: 13px; cursor: pointer; backdrop-filter: blur(10px); }
    .action-btn.active { background: rgba(255, 126, 27, 0.25); border-color: rgba(255, 158, 66, 0.6); }
    .text-composer { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(8, 5, 3, 0.95); border-top: 1px solid rgba(255, 160, 85, 0.2); padding: 16px; display: flex; gap: 10px; transform: translateY(100%); transition: transform 0.3s ease; z-index: 20; }
    .text-composer.open { transform: translateY(0); }
    .text-composer input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 165, 91, 0.2); border-radius: 12px; padding: 12px; color: #fff; outline: none; }
    .text-composer button { background: linear-gradient(135deg, #fff1d4, #ffbf76); border: none; border-radius: 12px; padding: 0 20px; color: #3d1a05; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app" id="novaApp">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">N</div>
        <span>NOVA</span>
      </div>
    </header>

    <main class="core-stage">
      <canvas id="coreCanvas"></canvas>
      <button class="core-btn" id="coreButton">
        <span class="core-title">NOVA</span>
        <span class="core-status" id="coreStatus">READY</span>
        <span class="core-instruction" id="coreInstruction">Tippen zum Starten</span>
      </button>
      <div class="chat-overlay" id="chatOverlay"></div>
    </main>

    <div class="controls-bar">
      <button class="action-btn" id="voiceButton">🎙️ Sprechen</button>
      <button class="action-btn" id="textModeBtn">💬 Schreiben</button>
    </div>

    <div class="text-composer" id="chatDrawer">
      <input type="text" id="messageInput" placeholder="Nachricht an NOVA..." disabled />
      <button id="sendButton" disabled>Senden</button>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const app = document.getElementById('novaApp') || document.body;
      const canvas = document.getElementById('coreCanvas');
      const ctx = canvas?.getContext('2d', { alpha: true });
      const coreButton = document.getElementById('coreButton');
      const coreStatus = document.getElementById('coreStatus');
      const coreInstruction = document.getElementById('coreInstruction');
      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const voiceButton = document.getElementById('voiceButton');
      const textButton = document.getElementById('textModeBtn');
      const drawer = document.getElementById('chatDrawer');
      const chatOverlay = document.getElementById('chatOverlay');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const voiceAvailable = !!SpeechRecognition;

      let initialized = false;
      let currentState = navigator.onLine ? 'idle' : 'offline';
      let width = 1, height = 1;
      let recognition = null;
      let isListening = false;
      let isTextMode = false;

      const language = localStorage.getItem('nova_language') || 'de-DE';
      const speechRate = Number(localStorage.getItem('nova_speech_rate') || '1');

      function setCoreState(state) {
        currentState = state || 'idle';
        const labels = { idle: 'READY', listening: 'LISTENING', thinking: 'PROCESSING', speaking: 'SPEAKING', error: 'ERROR', offline: 'OFFLINE' };
        if (coreStatus) coreStatus.textContent = labels[currentState] || labels.idle;
        if (coreInstruction) {
          if (currentState === 'listening') coreInstruction.textContent = 'NOVA hört zu…';
          else if (currentState === 'thinking') coreInstruction.textContent = 'NOVA verarbeitet…';
          else if (currentState === 'speaking') coreInstruction.textContent = 'NOVA spricht…';
          else if (!initialized) coreInstruction.textContent = 'Tippen zum Starten';
          else coreInstruction.textContent = isTextMode ? 'Tastatur aktiv' : 'Sprechen oder Modus wechseln';
        }
      }

      function appendChatMessage(text, sender) {
        if (!chatOverlay) return;
        const msg = document.createElement('div');
        msg.className = `msg ${sender}`;
        msg.style.cssText = `padding: 10px 14px; border-radius: 14px; font-size: 14px; margin-bottom: 8px; max-width: 85%; ${sender === 'user' ? 'align-self: flex-end; background: rgba(255,145,50,0.2); color:#fff;' : 'align-self: flex-start; background: rgba(18,9,4,0.7); color:#f4e9da;'}`;
        msg.textContent = text;
        chatOverlay.appendChild(msg);
        chatOverlay.scrollTop = chatOverlay.scrollHeight;
      }

      function initSpeechEngine() {
        if (!voiceAvailable) return null;
        const rec = new SpeechRecognition();
        rec.lang = language;
        rec.continuous = false;
        rec.interimResults = true;

        rec.onstart = () => { isListening = true; voiceButton?.classList.add('active'); setCoreState('listening'); };
        rec.onresult = (e) => {
          let interim = '', final = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) final += e.results[i][0].transcript;
            else interim += e.results[i][0].transcript;
          }
          if (coreInstruction) coreInstruction.textContent = interim || final || 'Höre zu…';
          if (final.trim()) dispatchMessage(final.trim(), 'voice');
        };
        rec.onerror = (e) => { isListening = false; voiceButton?.classList.remove('active'); if (e.error !== 'no-speech') setCoreState('idle'); };
        rec.onend = () => { isListening = false; voiceButton?.classList.remove('active'); if (currentState === 'listening') setCoreState('idle'); };
        return rec;
      }

      function startListening() {
        if (!initialized) unlockAudioAndStart();
        if (!voiceAvailable) { setCoreState('error'); return; }
        if (isListening) return;
        if (!recognition) recognition = initSpeechEngine();
        try { recognition.start(); } catch (e) {
          recognition.stop();
          setTimeout(() => { try { recognition.start(); } catch(err){} }, 150);
        }
      }

      function stopListening() {
        isListening = false;
        voiceButton?.classList.remove('active');
        if (recognition) try { recognition.stop(); } catch(e) {}
        if (currentState === 'listening') setCoreState('idle');
      }

      function speak(text) {
        if (!text || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = language; ut.rate = speechRate;
        ut.onstart = () => setCoreState('speaking');
        ut.onend = () => setCoreState('idle');
        ut.onerror = () => setCoreState('idle');
        window.speechSynthesis.speak(ut);
      }

      function unlockAudioAndStart() {
        if (initialized) return;
        initialized = true;
        if ('speechSynthesis' in window) window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
        if (messageInput) messageInput.disabled = false;
        if (sendButton) sendButton.disabled = false;
        switchToVoiceMode();
      }

      function dispatchMessage(text, source) {
        appendChatMessage(text, 'user');
        setCoreState('thinking');
        const event = new CustomEvent('nova:send', { detail: { message: text, source: source }, cancelable: true });
        const handled = !document.dispatchEvent(event);
        if (!handled) {
          setTimeout(() => {
            const reply = "Ich habe verstanden: " + text;
            appendChatMessage(reply, 'nova');
            speak(reply);
          }, 800);
        }
      }

      function switchToVoiceMode() {
        isTextMode = false;
        drawer?.classList.remove('open');
        textButton?.classList.remove('active');
        voiceButton?.classList.add('active');
        startListening();
      }

      function switchToTextMode() {
        isTextMode = true;
        stopListening();
        drawer?.classList.add('open');
        textButton?.classList.add('active');
        voiceButton?.classList.remove('active');
        setCoreState('idle');
        setTimeout(() => messageInput?.focus(), 100);
      }

      function handleSendText() {
        const text = messageInput?.value?.trim();
        if (!text) return;
        messageInput.value = '';
        dispatchMessage(text, 'text');
      }

      coreButton?.addEventListener('click', () => {
        if (!initialized) unlockAudioAndStart();
        else if (isListening) stopListening();
        else switchToVoiceMode();
      });

      voiceButton?.addEventListener('click', switchToVoiceMode);
      textButton?.addEventListener('click', switchToTextMode);
      sendButton?.addEventListener('click', handleSendText);
      messageInput?.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendText(); } });

      window.addEventListener('click', unlockAudioAndStart, { once: true });

      function resizeCanvas() {
        if (!canvas || !ctx) return;
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(1, rect.width || window.innerWidth);
        height = Math.max(1, rect.height || window.innerHeight);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      if (canvas) {
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
      }

      const particles = Array.from({ length: window.innerWidth < 600 ? 100 : 180 }, () => ({
        theta: Math.random() * Math.PI * 2,
        phi: Math.acos(Math.random() * 2 - 1),
        radius: 50 + Math.random() * 65,
        speed: 0.0003 + Math.random() * 0.0005,
        size: 0.6 + Math.random() * 1.4,
        alpha: 0.2 + Math.random() * 0.8
      }));

      function drawRing(cx, cy, r, rot, alpha, lw) {
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
        ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.4, 0, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,145,45,${alpha})`; ctx.lineWidth = lw; ctx.stroke(); ctx.restore();
      }

      function render(timestamp) {
        if (!ctx || !canvas) return;
        const time = timestamp * 0.001;
        const cx = width / 2, cy = height * 0.5;
        const base = Math.min(width, height) * 0.28;

        ctx.clearRect(0, 0, width, height);
        let intensity = currentState === 'thinking' ? 1.5 : currentState === 'listening' ? 1.2 : 0.7;
        let speed = currentState === 'thinking' ? 1.4 : 0.4;

        drawRing(cx, cy, base * 1.3, time * 0.2 * speed, 0.25 * intensity, 1);
        drawRing(cx, cy, base * 0.9, -time * 0.4 * speed, 0.45 * intensity, 1.2);

        particles.forEach(p => {
          const theta = p.theta + time * p.speed * 1000 * speed;
          const x = p.radius * Math.sin(p.phi) * Math.cos(theta);
          const y = p.radius * Math.cos(p.phi);
          const z = p.radius * Math.sin(p.phi) * Math.sin(theta);
          const scale = 350 / (350 + z);
          const px = cx + x * scale, py = cy + y * scale;

          ctx.beginPath();
          ctx.fillStyle = `rgba(255, 160, 50, ${p.alpha * intensity})`;
          ctx.arc(px, py, Math.max(0.3, p.size * scale), 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
      setCoreState('idle');
    })();
  </script>
</body>
</html>
