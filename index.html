<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>NOVA</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 50% -10%, rgba(0, 200, 255, .12), transparent 35%),
        #05070b;
      color: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: rgba(5, 7, 11, .94);
    }

    /* =========================
       HEADER
    ========================== */

    .header {
      height: 64px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding:
        max(8px, env(safe-area-inset-top))
        14px
        8px
        14px;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      background: rgba(7, 10, 15, .88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nova-orb {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      background:
        radial-gradient(circle at 35% 30%, #ffffff, #bdefff 16%, #23bfff 42%, #07121b 72%);
      box-shadow:
        0 0 18px rgba(0, 195, 255, .35),
        inset 0 0 10px rgba(255, 255, 255, .25);
      color: #031019;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .brand-status {
      margin-top: 4px;
      font-size: 9px;
      letter-spacing: .12em;
      color: #707984;
    }

    #connectionStatus {
      color: #61d9ff;
    }

    #connectionStatus.offline {
      color: #ff7575;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .055);
      border: 1px solid rgba(255, 255, 255, .07);
      color: #aeb8c3;
      transition: .2s ease;
    }

    .icon-button:active {
      transform: scale(.94);
      background: rgba(255, 255, 255, .1);
    }

    /* =========================
       CHAT
    ========================== */

    .chat-area {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    #messages,
    #chatMessages {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 22px 15px 18px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }

    #messages::-webkit-scrollbar,
    #chatMessages::-webkit-scrollbar {
      width: 0;
    }

    .nova-message {
      width: 100%;
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      animation: messageIn .22s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .nova-message-avatar {
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      margin-top: 1px;
      font-size: 10px;
      font-weight: 800;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .08);
    }

    .nova-message-assistant .nova-message-avatar {
      background:
        radial-gradient(circle, rgba(45, 200, 255, .28), rgba(0, 0, 0, .4));
      border-color: rgba(55, 202, 255, .24);
      color: #75dcff;
      box-shadow: 0 0 15px rgba(0, 195, 255, .12);
    }

    .nova-message-body {
      min-width: 0;
      flex: 1;
    }

    .nova-message-name {
      margin-bottom: 5px;
      font-size: 10px;
      color: #707984;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .nova-message-text {
      font-size: 15px;
      line-height: 1.58;
      color: #e9edf2;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .nova-message-user .nova-message-text {
      color: #ffffff;
    }

    .nova-message-user {
      padding-left: 4px;
    }

    /* =========================
       EMPTY STATE
    ========================== */

    .nova-empty-state {
      height: 100%;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .nova-empty-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      margin-bottom: 18px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .08em;
      background:
        radial-gradient(circle at 35% 30%, #fff, #80dcff 15%, #087aa5 45%, #08121a 72%);
      box-shadow:
        0 0 35px rgba(0, 195, 255, .18);
      color: #031019;
    }

    .nova-empty-state h2 {
      margin: 0;
      font-size: 21px;
      font-weight: 650;
    }

    .nova-empty-state p {
      margin: 8px 0 0;
      color: #69737e;
      font-size: 13px;
    }

    /* =========================
       TYPING
    ========================== */

    #typingIndicator,
    #typing {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 4px 15px 10px 55px;
      color: #6f7b86;
      font-size: 11px;
    }

    #typingIndicator.active,
    #typing.active {
      display: flex;
    }

    .nova-thinking #typingIndicator,
    .nova-thinking #typing {
      display: flex;
    }

    .typing-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      animation: typing 1.2s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: .15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: .25;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =========================
       COMPOSER
    ========================== */

    .composer {
      padding:
        8px
        12px
        max(10px, env(safe-area-inset-bottom))
        12px;
      background: linear-gradient(
        to top,
        rgba(5, 7, 11, 1),
        rgba(5, 7, 11, .96)
      );
    }

    .composer-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-height: 50px;
      padding: 7px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .055);
      border: 1px solid rgba(255, 255, 255, .085);
      box-shadow:
        0 8px 30px rgba(0, 0, 0, .25),
        inset 0 1px 0 rgba(255, 255, 255, .025);
    }

    #messageInput {
      flex: 1;
      width: 100%;
      min-width: 0;
      max-height: 180px;
      min-height: 36px;
      resize: none;
      outline: none;
      border: 0;
      background: transparent;
      color: #f3f6f8;
      padding: 8px 6px;
      line-height: 1.4;
      font-size: 15px;
    }

    #messageInput::placeholder {
      color: #68717b;
    }

    #sendButton {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #e9f8ff;
      color: #061019;
      font-size: 17px;
      font-weight: 700;
      transition: .2s ease;
    }

    #sendButton:active {
      transform: scale(.92);
    }

    /* =========================
       MOBILE DRAWER / CHAT LIST
    ========================== */

    #chatList,
    #chats {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 12px;
    }

    .nova-chat-item {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      background: transparent;
      color: #aeb7c0;
    }

    .nova-chat-item.active {
      background: rgba(255, 255, 255, .07);
      color: #fff;
    }

    .nova-chat-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .nova-chat-actions {
      display: flex;
    }

    .nova-chat-delete,
    .nova-memory-delete {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: transparent;
      color: #68727c;
      font-size: 18px;
    }

    .nova-chat-delete:active,
    .nova-memory-delete:active {
      background: rgba(255, 255, 255, .08);
      color: #fff;
    }

    /* =========================
       MEMORY
    ========================== */

    #memoryList,
    #memories {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .nova-memory-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 11px;
      border-radius: 11px;
      background: rgba(255, 255, 255, .045);
      border: 1px solid rgba(255, 255, 255, .06);
    }

    .nova-memory-text {
      flex: 1;
      min-width: 0;
      color: #cbd3da;
      font-size: 12px;
      line-height: 1.4;
    }

    .nova-memory-empty {
      padding: 12px;
      color: #68727c;
      font-size: 12px;
      text-align: center;
    }

    /* =========================
       OPTIONAL PANELS
    ========================== */

    .panel {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(8px);
    }

    .panel.open {
      display: flex;
      align-items: flex-end;
    }

    .panel-content {
      width: 100%;
      max-height: 88dvh;
      overflow-y: auto;
      padding: 18px 15px max(20px, env(safe-area-inset-bottom));
      border-radius: 24px 24px 0 0;
      background: #0b0f15;
      border-top: 1px solid rgba(255, 255, 255, .08);
    }

    .panel-handle {
      width: 38px;
      height: 4px;
      border-radius: 10px;
      margin: 0 auto 18px;
      background: rgba(255, 255, 255, .15);
    }

    /* =========================
       DESKTOP NICHT ERZWINGEN
       =========================
       NOVA ist bewusst Mobile-first.
    ========================== */

    @media (min-width: 700px) {
      body {
        max-width: 480px;
        margin: 0 auto;
        border-left: 1px solid rgba(255,255,255,.05);
        border-right: 1px solid rgba(255,255,255,.05);
      }
    }
  </style>
</head>

<body>

  <div class="app" id="novaApp">

    <header class="header">

      <div class="brand">
        <div class="nova-orb">N</div>

        <div class="brand-text">
          <div class="brand-name">NOVA</div>

          <div class="brand-status">
            AI ASSISTANT ·
            <span id="connectionStatus">
              CONNECTING
            </span>
          </div>
        </div>
      </div>

      <div class="header-actions">

        <button
          class="icon-button"
          id="newChat"
          type="button"
          aria-label="Neuer Chat"
        >
          ＋
        </button>

        <button
          class="icon-button"
          id="settings"
          type="button"
          aria-label="Einstellungen"
        >
          ⚙
        </button>

        <button
          class="icon-button"
          id="mobileSettings"
          type="button"
          aria-label="Menü"
        >
          ⋯
        </button>

      </div>

    </header>

    <main class="chat-area">

      <div id="novaHud"></div>
        id="messages"
        aria-live="polite"
        aria-label="NOVA Unterhaltung"
      ></div>

      <div
        id="typingIndicator"
        aria-hidden="true"
      >
        <span>NOVA denkt</span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>

    </main>

    <footer class="composer">

      <div class="composer-box">

        <textarea
          id="messageInput"
          rows="1"
          autocomplete="off"
          autocorrect="on"
          spellcheck="true"
          placeholder="Nachricht an NOVA…"
          aria-label="Nachricht"
        ></textarea>

        <button
          id="sendButton"
          type="button"
          aria-label="Nachricht senden"
        >
          ↑
        </button>

      </div>

    </footer>

  </div>

  <!--
    Versteckte/optionale Container.
    Die JS-Module können sie verwenden, ohne
    dass die Hauptoberfläche verändert wird.
  -->

  <div id="chatList" hidden></div>
  <div id="memoryList" hidden></div>

  <script type="module" src="/js/app.js"></script>

</body>
</html>
