<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NOVA — AI Assistant</title>

<style>
:root{
  --bg:#05070d;
  --panel:rgba(13,19,32,.88);
  --panel2:rgba(17,24,40,.97);
  --border:rgba(255,255,255,.09);
  --text:#f7f9ff;
  --muted:#8994aa;
  --blue:#63c8ff;
  --purple:#8b7cff;
  --green:#65efb1;
  --red:#ff718f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
}

.app{
  min-height:100dvh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 22%,rgba(73,151,255,.16),transparent 30%),
    radial-gradient(circle at 10% 90%,rgba(139,124,255,.1),transparent 28%),
    var(--bg);
}

.grid{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.4;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:38px 38px;
}

header{
  height:74px;
  padding:env(safe-area-inset-top) 20px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:5;
}

.logo{
  font-size:20px;
  font-weight:800;
  letter-spacing:6px;
}

.online{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:1.4px;
}

.online-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 15px var(--green);
}

main{
  min-height:calc(100dvh - 136px);
  padding:20px 20px 105px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:2;
}

.welcome{
  text-align:center;
}

.welcome h1{
  font-size:clamp(28px,8vw,43px);
  line-height:1.05;
  letter-spacing:-1.7px;
}

.welcome p{
  margin-top:10px;
  color:var(--muted);
  font-size:14px;
}

.core-container{
  width:min(78vw,310px);
  height:min(78vw,310px);
  position:relative;
  display:grid;
  place-items:center;
}

.core-ring{
  position:absolute;
  inset:9%;
  border:1px solid rgba(99,200,255,.22);
  border-radius:50%;
  animation:rotate 12s linear infinite;
}

.core-ring::after{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  top:3%;
  left:50%;
  transform:translateX(-50%);
  border-radius:50%;
  background:var(--blue);
  box-shadow:0 0 12px var(--blue),0 0 25px rgba(99,200,255,.5);
}

.core-ring.two{
  inset:20%;
  border-color:rgba(139,124,255,.25);
  animation-duration:8s;
  animation-direction:reverse;
}

.core-ring.three{
  inset:31%;
  animation-duration:5s;
}

.core{
  width:25%;
  aspect-ratio:1;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #fff 0%,
      #c8f1ff 14%,
      #67c9ff 37%,
      #3154a0 65%,
      #111a38 76%,
      transparent 78%
    );
  box-shadow:
    0 0 25px rgba(99,200,255,.95),
    0 0 65px rgba(99,200,255,.42),
    0 0 120px rgba(139,124,255,.22);
  animation:breathe 2.5s ease-in-out infinite;
}

.listening .core{
  animation:listening .75s ease-in-out infinite;
}

.thinking .core{
  animation:thinking 1.2s ease-in-out infinite;
}

@keyframes rotate{
  to{transform:rotate(360deg)}
}

@keyframes breathe{
  0%,100%{transform:scale(.94)}
  50%{transform:scale(1.08)}
}

@keyframes listening{
  0%,100%{transform:scale(.9)}
  50%{transform:scale(1.17)}
}

@keyframes thinking{
  0%,100%{transform:scale(.94) rotate(0)}
  50%{transform:scale(1.08) rotate(180deg)}
}

.state{
  height:20px;
  margin-bottom:17px;
  color:var(--muted);
  font-size:12px;
}

.listening .state{color:var(--blue)}
.thinking .state{color:var(--purple)}

.controls{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}

.mic{
  width:74px;
  height:74px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(255,255,255,.055);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  font-size:25px;
  cursor:pointer;
  transition:.18s;
  box-shadow:0 14px 45px rgba(0,0,0,.3);
}

.mic:active{
  transform:scale(.92);
}

.listening .mic{
  background:rgba(99,200,255,.13);
  border-color:rgba(99,200,255,.45);
  box-shadow:0 0 35px rgba(99,200,255,.32);
}

.hint{
  color:#667188;
  font-size:11px;
}

.quick-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  max-width:370px;
}

.quick{
  padding:9px 12px;
  border:1px solid var(--border);
  border-radius:999px;
  background:rgba(255,255,255,.035);
  color:var(--muted);
  font-size:11px;
  cursor:pointer;
}

.bottom-nav{
  position:fixed;
  z-index:10;
  left:50%;
  bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(92vw,420px);
  height:62px;
  padding:5px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border:1px solid var(--border);
  border-radius:22px;
  background:rgba(9,13,23,.8);
  backdrop-filter:blur(25px);
}

.nav-button{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:16px;
  background:transparent;
  color:#68748b;
  font-size:19px;
  cursor:pointer;
}

.nav-button.active{
  background:rgba(255,255,255,.075);
  color:white;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:flex-end;
  background:rgba(2,4,8,.7);
  backdrop-filter:blur(9px);
}

.overlay.open{
  display:flex;
}

.sheet{
  width:100%;
  max-height:88dvh;
  overflow-y:auto;
  padding:15px 18px calc(25px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  border-radius:28px 28px 0 0;
  background:var(--panel2);
  animation:slideUp .25s ease;
}

@keyframes slideUp{
  from{
    transform:translateY(40px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.sheet-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.sheet-header h2{
  font-size:20px;
}

.close{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:rgba(255,255,255,.06);
  cursor:pointer;
}

.chat{
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:190px;
  max-height:50dvh;
  overflow-y:auto;
}

.message{
  max-width:88%;
  padding:11px 13px;
  border-radius:17px;
  font-size:14px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.nova{
  align-self:flex-start;
  background:rgba(255,255,255,.055);
  border:1px solid var(--border);
}

.message.user{
  align-self:flex-end;
  background:linear-gradient(135deg,#3d91d2,#7064d8);
}

.composer{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.composer input,
.memory-input{
  min-width:0;
  flex:1;
  padding:12px 14px;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:15px;
  outline:none;
  background:rgba(255,255,255,.05);
}

.send{
  padding:0 16px;
  border-radius:15px;
  background:linear-gradient(135deg,#3d91d2,#7064d8);
  cursor:pointer;
}

.setting{
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.setting strong{
  display:block;
  font-size:14px;
}

.setting small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}

.toggle{
  width:48px;
  height:28px;
  padding:3px;
  border-radius:20px;
  background:#303747;
  cursor:pointer;
  flex:none;
}

.toggle span{
  display:block;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.toggle.on{
  background:#397eb3;
}

.toggle.on span{
  transform:translateX(20px);
}

.danger{
  color:var(--red);
  background:rgba(255,113,143,.08);
  border:1px solid rgba(255,113,143,.18);
  border-radius:12px;
  padding:9px 11px;
  font-size:11px;
  cursor:pointer;
}

.memory-add{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.memory-add button{
  padding:0 13px;
  border-radius:14px;
  background:linear-gradient(135deg,#3d91d2,#7064d8);
  cursor:pointer;
}

.memory-list{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-top:12px;
}

.memory-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:13px;
  background:rgba(255,255,255,.035);
}

.memory-text{
  flex:1;
  min-width:0;
  color:#e9edf7;
  font-size:12px;
  line-height:1.4;
  word-break:break-word;
}

.memory-delete{
  width:30px;
  height:30px;
  border-radius:9px;
  color:var(--red);
  background:rgba(255,113,143,.08);
  cursor:pointer;
  flex:none;
}

.empty{
  color:var(--muted);
  font-size:11px;
  padding:8px 0;
}

.toast{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:91px;
  transform:translate(-50%,15px);
  opacity:0;
  pointer-events:none;
  padding:10px 14px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#141b2a;
  color:#fff;
  font-size:12px;
  transition:.22s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
</style>
</head>

<body>

<div class="app" id="app">

<div class="grid"></div>

<header>
  <div class="logo">NOVA</div>

  <div class="online">
    <span class="online-dot"></span>
    <span>ONLINE</span>
  </div>
</header>

<main>

<section class="welcome">
  <h1>Wie kann ich helfen?</h1>
  <p>Dein persönlicher KI-Assistent</p>
</section>

<section class="core-container">
  <div class="core-ring"></div>
  <div class="core-ring two"></div>
  <div class="core-ring three"></div>
  <div class="core"></div>
</section>

<div class="state" id="state">Bereit</div>

<section class="controls">

<button class="mic" id="micButton" type="button">
  🎙️
</button>

<div class="hint" id="hint">
  Tippe auf das Mikrofon
</div>

<div class="quick-actions">

<button class="quick" data-command="Hallo NOVA">
  Hallo NOVA
</button>

<button class="quick" data-command="Was kannst du?">
  Was kannst du?
</button>

<button class="quick" data-command="Erkläre mir etwas">
  Etwas erklären
</button>

</div>

</section>

</main>

<nav class="bottom-nav">

<button class="nav-button active" data-page="home" type="button">
  ⌂
</button>

<button class="nav-button" data-page="chat" type="button">
  ◌
</button>

<button class="nav-button" data-page="settings" type="button">
  ⚙
</button>

</nav>

<div class="overlay" id="overlay">

<div class="sheet">

<div class="sheet-header">
  <h2 id="sheetTitle">NOVA</h2>

  <button class="close" id="closeButton" type="button">
    ✕
  </button>
</div>

<div id="sheetContent"></div>

</div>

</div>

<div class="toast" id="toast"></div>

</div>

<script>
"use strict";

const NOVA = (() => {

  const $ = id => document.getElementById(id);

  const app = $("app");
  const state = $("state");
  const hint = $("hint");
  const mic = $("micButton");
  const overlay = $("overlay");
  const title = $("sheetTitle");
  const content = $("sheetContent");
  const close = $("closeButton");
  const toast = $("toast");

  const STORAGE = {
    chat: "nova_chat_history_v10",
    voice: "nova_voice_enabled_v10",
    memory: "nova_memory_v10"
  };

  let recognition = null;
  let listening = false;

  let voiceEnabled =
    localStorage.getItem(STORAGE.voice) !== "0";

  function notify(message){

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(notify.timer);

    notify.timer = setTimeout(() => {
      toast.classList.remove("show");
    },2200);
  }

  function setState(type,text){

    app.classList.remove("listening","thinking");

    if(type){
      app.classList.add(type);
    }

    state.textContent = text;
  }

  function loadHistory(){

    try{

      const data =
        JSON.parse(
          localStorage.getItem(STORAGE.chat) || "[]"
        );

      return Array.isArray(data)
        ? data.filter(
            item =>
              item &&
              typeof item.text === "string" &&
              (item.role === "user" || item.role === "nova")
          ).slice(-50)
        : [];

    }catch{

      return [];
    }
  }

  function saveHistory(history){

    localStorage.setItem(
      STORAGE.chat,
      JSON.stringify(history.slice(-50))
    );
  }

  function addHistory(role,text){

    const history = loadHistory();

    history.push({
      role,
      text,
      time:Date.now()
    });

    saveHistory(history);
  }

  function loadMemories(){

    try{

      const data =
        JSON.parse(
          localStorage.getItem(STORAGE.memory) || "[]"
        );

      return Array.isArray(data)
        ? data
            .filter(
              item =>
                item &&
                typeof item.text === "string"
            )
            .slice(0,100)
        : [];

    }catch{

      return [];
    }
  }

  function saveMemories(memories){

    localStorage.setItem(
      STORAGE.memory,
      JSON.stringify(memories.slice(0,100))
    );
  }

  function addMemory(text){

    const clean =
      String(text || "")
        .trim()
        .replace(/\s+/g," ");

    if(!clean){
      return false;
    }

    const memories = loadMemories();

    const exists =
      memories.some(
        item =>
          item.text.toLowerCase() ===
          clean.toLowerCase()
      );

    if(exists){
      return false;
    }

    memories.unshift({
      text:clean,
      time:Date.now()
    });

    saveMemories(memories);

    return true;
  }

  function deleteMemory(index){

    const memories = loadMemories();

    if(
      index < 0 ||
      index >= memories.length
    ){
      return false;
    }

    memories.splice(index,1);

    saveMemories(memories);

    return true;
  }

  function clearMemories(){

    localStorage.removeItem(
      STORAGE.memory
    );
  }

  function extractMemoryCommand(text){

    const match =
      text.match(
        /^\s*(?:merk dir|merke dir|denk dir|vergiss nicht|speicher(?:e)?(?: dir)?)\s*[:,-]?\s*(.+)$/i
      );

    return match
      ? match[1].trim()
      : null;
  }

  function memoryQuestion(text){

    return /\b(was weißt du über mich|was weißt du von mir|meine erinnerungen|meine memories|was hast du dir gemerkt|was merkst du dir)\b/i.test(
      text
    );
  }

  function speak(text){

    if(!voiceEnabled){
      return;
    }

    if(!("speechSynthesis" in window)){
      return;
    }

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "de-DE";
    utterance.rate = .98;
    utterance.pitch = 1;

    utterance.onstart = () => {
      setState("thinking","NOVA spricht…");
    };

    utterance.onend = () => {
      setState("","Bereit");
    };

    utterance.onerror = () => {
      setState("","Bereit");
    };

    speechSynthesis.speak(utterance);
  }

  function addMessage(role,text){

    const chat = $("novaChat");

    if(!chat){
      return;
    }

    const message =
      document.createElement("div");

    message.className =
      "message " +
      (role === "user"
        ? "user"
        : "nova");

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop =
      chat.scrollHeight;
  }

  function renderChat(){

    title.textContent = "NOVA Chat";

    content.innerHTML = `
      <div class="chat" id="novaChat"></div>

      <form class="composer" id="composer">

        <input
          id="chatInput"
          type="text"
          maxlength="4000"
          autocomplete="off"
          placeholder="Nachricht an NOVA…"
        >

        <button class="send" type="submit">
          Senden
        </button>

      </form>
    `;

    const chat = $("novaChat");

    loadHistory().forEach(item => {
      addMessage(
        item.role,
        item.text
      );
    });

    $("composer").addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const input = $("chatInput");

        const text =
          input.value.trim();

        if(!text){
          return;
        }

        input.value = "";

        await send(text);

        input.focus();
      }
    );

    requestAnimationFrame(() => {

      chat.scrollTop =
        chat.scrollHeight;

      $("chatInput").focus();

    });
  }

  async function send(text){

    const memory =
      extractMemoryCommand(text);

    addHistory("user",text);
    addMessage("user",text);

    if(memory){

      const saved =
        addMemory(memory);

      const answer =
        saved
          ? "Verstanden. Ich habe mir das gemerkt. 🧠"
          : "Das habe ich bereits in meinem Memory.";

      addHistory("nova",answer);
      addMessage("nova",answer);

      setState("","Bereit");

      speak(answer);

      return;
    }

    if(memoryQuestion(text)){

      const memories =
        loadMemories();

      let answer;

      if(!memories.length){

        answer =
          "Aktuell habe ich noch keine persönlichen Erinnerungen gespeichert.";

      }else{

        answer =
          "Das habe ich mir über dich gemerkt:\n\n" +
          memories
            .map(
              (item,index) =>
                `${index + 1}. ${item.text}`
            )
            .join("\n");
      }

      addHistory("nova",answer);
      addMessage("nova",answer);

      setState("","Bereit");

      speak(answer);

      return;
    }

    setState("thinking","NOVA denkt…");

    try{

      const response =
        await fetch(
          "/api/chat",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              message:text,

              history:
                loadHistory()
                  .slice(-20)
                  .map(item => ({
                    role:item.role,
                    text:item.text
                  })),

              memories:
                loadMemories()
                  .map(item => item.text)

            })
          }
        );

      let data;

      try{

        data =
          await response.json();

      }catch{

        throw new Error(
          "Ungültige Serverantwort."
        );
      }

      if(!response.ok){

        throw new Error(
          data?.error ||
          "NOVA konnte die Anfrage nicht verarbeiten."
        );
      }

      const answer =
        String(
          data?.answer || ""
        ).trim();

      if(!answer){

        throw new Error(
          "NOVA hat keine Antwort erhalten."
        );
      }

      addHistory("nova",answer);
      addMessage("nova",answer);

      setState("","Bereit");

      speak(answer);

    }catch(error){

      console.error(error);

      const message =
        error?.message ||
        "Verbindung zu NOVA fehlgeschlagen.";

      const errorMessage =
        "Entschuldigung — " +
        message;

      addMessage(
        "nova",
        errorMessage
      );

      setState("","Bereit");

      notify(message);
    }
  }

  function renderSettings(){

    title.textContent =
      "Einstellungen";

    const memories =
      loadMemories();

    content.innerHTML = `

      <div class="setting">

        <div class="setting-row">

          <div>
            <strong>
              Sprachausgabe
            </strong>

            <small>
              NOVA liest Antworten automatisch vor.
            </small>
          </div>

          <button
            class="toggle ${
              voiceEnabled ? "on" : ""
            }"
            id="voiceToggle"
            type="button"
          >
            <span></span>
          </button>

        </div>

      </div>

      <div class="setting">

        <strong>
          🧠 NOVA Memory
        </strong>

        <small>
          NOVA kann wichtige Informationen lokal auf diesem Gerät speichern.
        </small>

        <div class="memory-add">

          <input
            class="memory-input"
            id="memoryInput"
            type="text"
            maxlength="500"
            autocomplete="off"
            placeholder="z. B. Ich mag Fußball"
          >

          <button
            id="memoryAdd"
            type="button"
          >
            Merken
          </button>

        </div>

        <div
          class="memory-list"
          id="memoryList"
        ></div>

      </div>

      <div class="setting">

        <div class="setting-row">

          <div>
            <strong>
              Gespräch löschen
            </strong>

            <small>
              Entfernt den lokal gespeicherten Chat.
            </small>
          </div>

          <button
            class="danger"
            id="clearChat"
            type="button"
          >
            Löschen
          </button>

        </div>

      </div>

      <div class="setting">

        <div class="setting-row">

          <div>
            <strong>
              Alle Memories löschen
            </strong>

            <small>
              Entfernt alle gespeicherten Erinnerungen.
            </small>
          </div>

          <button
            class="danger"
            id="clearMemory"
            type="button"
          >
            Löschen
          </button>

        </div>

      </div>

      <div class="setting">

        <div class="setting-row">

          <div>
            <strong>
              NOVA
            </strong>

            <small>
              KI Assistant · Memory 1.0
            </small>
          </div>

          <strong>
            1.0
          </strong>

        </div>

      </div>
    `;

    renderMemoryList();

    $("voiceToggle").onclick = () => {

      voiceEnabled =
        !voiceEnabled;

      localStorage.setItem(
        STORAGE.voice,
        voiceEnabled ? "1" : "0"
      );

      renderSettings();

      notify(
        voiceEnabled
          ? "Sprachausgabe aktiviert"
          : "Sprachausgabe deaktiviert"
      );
    };

    $("memoryAdd").onclick = () => {

      const input =
        $("memoryInput");

      const value =
        input.value.trim();

      if(!value){

        notify(
          "Bitte eine Erinnerung eingeben."
        );

        return;
      }

      if(addMemory(value)){

        input.value = "";

        renderSettings();

        notify(
          "Memory gespeichert. 🧠"
        );

      }else{

        notify(
          "Diese Erinnerung ist bereits gespeichert."
        );
      }
    };

    $("memoryInput").addEventListener(
      "keydown",
      event => {

        if(event.key === "Enter"){

          event.preventDefault();

          $("memoryAdd").click();
        }
      }
    );

    $("clearChat").onclick = () => {

      if(
        !confirm(
          "Möchtest du den NOVA-Chat wirklich löschen?"
        )
      ){
        return;
      }

      localStorage.removeItem(
        STORAGE.chat
      );

      closePanel();

      notify(
        "Chat gelöscht"
      );
    };

    $("clearMemory").onclick = () => {

      if(!loadMemories().length){

        notify(
          "Es sind keine Memories vorhanden."
        );

        return;
      }

      if(
        !confirm(
          "Möchtest du wirklich alle NOVA-Memories löschen?"
        )
      ){
        return;
      }

      clearMemories();

      renderSettings();

      notify(
        "Alle Memories gelöscht."
      );
    };
  }

  function renderMemoryList(){

    const list =
      $("memoryList");

    if(!list){
      return;
    }

    list.innerHTML = "";

    const memories =
      loadMemories();

    if(!memories.length){

      list.innerHTML =
        `<div class="empty">
          Noch keine Erinnerungen gespeichert.
        </div>`;

      return;
    }

    memories.forEach(
      (memory,index) => {

        const item =
          document.createElement("div");

        item.className =
          "memory-item";

        const text =
          document.createElement("div");

        text.className =
          "memory-text";

        text.textContent =
          memory.text;

        const button =
          document.createElement("button");

        button.className =
          "memory-delete";

        button.type =
          "button";

        button.textContent =
          "×";

        button.setAttribute(
          "aria-label",
          "Erinnerung löschen"
        );

        button.onclick = () => {

          deleteMemory(index);

          renderMemoryList();

          notify(
            "Erinnerung gelöscht."
          );
        };

        item.appendChild(text);
        item.appendChild(button);

        list.appendChild(item);
      }
    );
  }

  function open(type){

    overlay.classList.add("open");

    if(type === "chat"){
      renderChat();
    }

    if(type === "settings"){
      renderSettings();
    }
  }

  function closePanel(){

    overlay.classList.remove(
      "open"
    );
  }

  function setupRecognition(){

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!SpeechRecognition){
      return null;
    }

    const instance =
      new SpeechRecognition();

    instance.lang =
      "de-DE";

    instance.continuous =
      false;

    instance.interimResults =
      false;

    instance.maxAlternatives =
      1;

    instance.onstart = () => {

      listening = true;

      setState(
        "listening",
        "Ich höre zu…"
      );

      hint.textContent =
        "Sprich jetzt mit NOVA";
    };

    instance.onresult =
      event => {

        const transcript =
          event.results?.[0]?.[0]?.transcript?.trim();

        listening = false;

        if(!transcript){

          setState(
            "",
            "Bereit"
          );

          return;
        }

        open("chat");

        setTimeout(
          () => send(transcript),
          100
        );
      };

    instance.onerror =
      event => {

        listening = false;

        setState(
          "",
          "Bereit"
        );

        hint.textContent =
          "Tippe auf das Mikrofon";

        if(
          event.error ===
          "not-allowed"
        ){

          notify(
            "Mikrofonzugriff wurde verweigert."
          );

          return;
        }

        if(
          event.error ===
          "no-speech"
        ){

          notify(
            "Ich habe nichts gehört."
          );

          return;
        }

        notify(
          "Spracherkennung konnte nicht gestartet werden."
        );
      };

    instance.onend = () => {

      listening = false;

      if(
        !app.classList.contains(
          "thinking"
        )
      ){

        setState(
          "",
          "Bereit"
        );
      }

      hint.textContent =
        "Tippe auf das Mikrofon";
    };

    return instance;
  }

  function toggleMic(){

    if(
      listening &&
      recognition
    ){

      recognition.stop();

      return;
    }

    if(!window.isSecureContext){

      notify(
        "Sprachsteuerung benötigt HTTPS."
      );

      return;
    }

    recognition =
      setupRecognition();

    if(!recognition){

      notify(
        "Dieser Browser unterstützt keine Spracherkennung."
      );

      return;
    }

    try{

      recognition.start();

    }catch{

      notify(
        "Mikrofon konnte nicht gestartet werden."
      );
    }
  }

  function setupNavigation(){

    document
      .querySelectorAll(
        ".nav-button"
      )
      .forEach(button => {

        button.onclick = () => {

          const page =
            button.dataset.page;

          document
            .querySelectorAll(
              ".nav-button"
            )
            .forEach(item => {

              item.classList.toggle(
                "active",
                item === button
              );
            });

          if(page === "home"){

            closePanel();

            return;
          }

          open(page);
        };
      });
  }

  function setupQuickActions(){

    document
      .querySelectorAll(
        "[data-command]"
      )
      .forEach(button => {

        button.onclick = () => {

          open("chat");

          setTimeout(
            () =>
              send(
                button.dataset.command
              ),
            100
          );
        };
      });
  }

  function init(){

    mic.onclick =
      toggleMic;

    close.onclick =
      closePanel;

    overlay.onclick =
      event => {

        if(
          event.target ===
          overlay
        ){

          closePanel();
        }
      };

    document.addEventListener(
      "keydown",
      event => {

        if(
          event.key ===
          "Escape"
        ){

          closePanel();
        }
      }
    );

    setupNavigation();
    setupQuickActions();

    setState(
      "",
      "Bereit"
    );
  }

  return {
    init
  };

})();

NOVA.init();
</script>

</body>
</html>
